[project]
name = "enterprise-workflow-agent"
version = "0.10.0"
description = "A staged learning project for document checks and human approvals"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20,<2",
    "fastapi>=0.142.2,<1",
    "psycopg[binary]>=3.3,<4",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.15,<3",
    "pypdf>=6.19,<7",
    "sqlalchemy>=2.1.4,<2.2",
    "uvicorn>=0.54,<1",
]

[dependency-groups]
dev = [
    # Current Starlette TestClient uses HTTPX2.
    "httpx2>=2.13.1,<3",
    "mypy>=2.4,<3",
    "pytest>=9.1,<10",
    "ruff>=0.16.10,<0.17",
]
# PDF guide generator only; install with `uv run --locked --group guide ...`.
guide = [
    "reportlab==4.4.9",
]
# Stage 08 Streamlit client only; it talks to the HTTP API, never the database.
ui = [
    "streamlit>=1.65,<2",
]

[tool.uv]
# Resolve releases at least two weeks old at this project's start date.
exclude-newer = "2026-10-09T00:00:00Z"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers"
markers = [
    "postgres: needs TEST_DATABASE_URL pointing to a disposable database ending in _test",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# Guide text modules hold paired Russian/English prose; splitting sentences
# to 88 columns would hurt translation review. Code modules keep the limit.
[tool.ruff.lint.per-file-ignores]
"scripts/guide/stage*.py" = ["E501"]
"scripts/guide/story.py" = ["E501"]
"scripts/guide/diagrams.py" = ["E501"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

# ReportLab ships no typing metadata and is installed only with --group guide.
[[tool.mypy.overrides]]
module = ["reportlab", "reportlab.*"]
ignore_missing_imports = true

# Guide flowables subclass ReportLab classes, which mypy sees as Any.
[[tool.mypy.overrides]]
module = ["guide", "guide.*"]
disallow_subclassing_any = false
